name: Deploy public knowledge base

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_REPOSITORY_URL: ${{ vars.PUBLIC_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: "11.15.1"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate public URLs
        run: >-
          bun -e 'import { parseSiteConfig } from
          "./src/config/site.ts"; parseSiteConfig(process.env)'
      - run: pnpm exec playwright install --with-deps chromium
      - run: script/ci
      - run: script/build
      - run: pnpm exec playwright test tests/e2e/home.spec.ts tests/e2e/entity-pages.spec.ts --project=desktop
      - name: Validate deployment package
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
